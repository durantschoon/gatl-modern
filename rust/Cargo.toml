[package]
name = "gatl-rust"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of GATL (Geometric Algebra Template Library) - Modern Algebraic Types"
authors = ["Leandro A. F. Fernandes <laffernandes@ic.uff.br>", "Durant Schoon <durant.schoon@gmail.com>"]
license = "MPL-2.0"
repository = "https://github.com/durantschoon/gatl"
keywords = ["geometric-algebra", "clifford-algebra", "mathematics", "physics", "modern-types"]
categories = ["science", "mathematics"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
